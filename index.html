<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindFlow Ultra | Prestige Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@200;400;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Assistant', sans-serif; background-color: #0a0a0b; color: white; overflow-x: hidden; }
        .luxury-gradient { background: linear-gradient(135deg, #c5a47e 0%, #8e7356 100%); }
        .firework {
            position: absolute; width: 5px; height: 5px; background: #c5a47e; border-radius: 50%;
            animation: explode 2s ease-out infinite; opacity: 0;
        }
        @keyframes explode {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(20); opacity: 0; }
        }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body x-data="mindFlowApp()" x-init="init()">

    <template x-if="!onboardingComplete">
        <div class="min-h-screen bg-[#0a0a0b] flex items-center justify-center p-6 text-center">
            <div class="max-w-sm">
                <i data-lucide="shield-check" class="w-24 h-24 text-[#c5a47e] mx-auto mb-8"></i>
                <h2 class="text-4xl font-black mb-4 italic tracking-widest text-[#c5a47e]">MINDFLOW</h2>
                <p class="text-slate-400 mb-10 font-bold">הפלטפורמה היוקרתית של אליאב ודקל.</p>
                <button @click="completeOnboarding()" class="w-full luxury-gradient text-black p-6 rounded-3xl font-black text-xl hover:scale-105 transition-all">
                    צא לדרך
                </button>
            </div>
        </div>
    </template>

    <template x-if="onboardingComplete">
        <div class="min-h-screen pb-48 relative">
            
            <div class="fixed inset-0 pointer-events-none z-0">
                <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-[#c5a47e]/5 blur-[120px] rounded-full"></div>
                <div class="absolute inset-0 bg-black opacity-20"></div>
            </div>

            <div x-show="showLevelUp" x-cloak class="fixed inset-0 z-[200] flex items-center justify-center bg-black/95 backdrop-blur-2xl">
                <div class="firework" style="top: 40%; left: 30%;"></div>
                <div class="firework" style="top: 60%; left: 70%; animation-delay: 0.5s;"></div>
                <div class="text-center relative z-10">
                    <i data-lucide="trophy" class="w-48 h-48 text-[#c5a47e] mx-auto mb-10 drop-shadow-2xl"></i>
                    <h1 class="text-6xl font-black mb-6">כל הכבוד!</h1>
                    <p class="text-3xl font-black text-[#c5a47e] mb-12 italic">עלית לרמה <span x-text="userProfile.level"></span>!</p>
                    <button @click="showLevelUp = false" class="luxury-gradient text-black px-12 py-5 rounded-[2.5rem] font-black text-2xl">תודה! ממשיכים</button>
                </div>
            </div>

            <header class="px-8 py-12 flex justify-between items-center max-w-2xl mx-auto relative z-10">
                <div class="flex items-center gap-5">
                    <div class="relative">
                        <div class="w-16 h-16 bg-[#1a1a1c] rounded-[1.8rem] flex items-center justify-center text-[#c5a47e] text-2xl font-black border-2 border-[#c5a47e]/30">
                            <span x-text="userProfile.name[0]"></span>
                        </div>
                        <div class="absolute -bottom-1 -right-1 w-6 h-6 bg-[#c5a47e] rounded-full border-2 border-black flex items-center justify-center text-[10px] font-black text-black" x-text="userProfile.level"></div>
                    </div>
                    <div>
                        <h2 class="text-2xl font-black text-white/90">היי <span x-text="userProfile.name"></span>,</h2>
                        <div class="flex gap-3 text-[10px] font-black uppercase text-[#c5a47e] tracking-widest mt-1">
                            <span>🔥 <span x-text="userProfile.streak"></span> DAY STREAK</span>
                            <span>⭐ <span x-text="userProfile.xp"></span> XP</span>
                        </div>
                    </div>
                </div>
            </header>

            <main class="max-w-2xl mx-auto px-8 relative z-10">
                
                <div x-show="activeTab === 'dashboard'" class="space-y-10">
                    <section class="bg-[#151517] rounded-[3.5rem] p-10 relative overflow-hidden border border-white/5 shadow-2xl">
                        <div class="relative z-10">
                            <p class="text-[#c5a47e] font-black text-[10px] tracking-[0.2em] mb-1">PRESTIGE STATUS</p>
                            <h3 class="text-5xl font-black mb-6"><span x-text="userProfile.xp"></span> <span class="text-lg opacity-20">/ <span x-text="userProfile.xpToNextLevel"></span></span></h3>
                            <div class="h-2 bg-black/40 rounded-full overflow-hidden border border-white/5">
                                <div class="h-full luxury-gradient transition-all duration-1000" :style="`width: ${(userProfile.xp / userProfile.xpToNextLevel) * 100}%`"></div>
                            </div>
                        </div>
                    </section>

                    <section class="space-y-6">
                        <div class="flex justify-between items-center px-2">
                            <h3 class="text-2xl font-black">משימות יומיות</h3>
                            <button @click="showAddTask = true" class="luxury-gradient text-black px-6 py-3 rounded-2xl font-black text-xs uppercase">הוסף משימה +</button>
                        </div>
                        <div class="space-y-4">
                            <template x-for="task in tasks" :key="task.id">
                                <div class="bg-[#111112] p-6 rounded-[2.5rem] flex items-center border border-white/5" :class="task.done ? 'opacity-30' : ''">
                                    <button @click="toggleTask(task.id)" class="w-12 h-12 rounded-2xl border ml-6 flex items-center justify-center transition-all" :class="task.done ? 'bg-[#c5a47e] text-black border-[#c5a47e]' : 'border-white/10 text-white/20'">
                                        <i x-show="!task.done" data-lucide="zap" class="w-6 h-6"></i>
                                        <i x-show="task.done" data-lucide="check" class="w-6 h-6"></i>
                                    </button>
                                    <div class="flex-1">
                                        <h4 class="font-black text-lg" :class="task.done ? 'line-through' : ''" x-text="task.title"></h4>
                                        <p class="text-[10px] text-slate-500 font-black uppercase" x-text="task.sub"></p>
                                    </div>
                                    <button @click="deleteTask(task.id)" class="text-red-900/40 hover:text-red-500"><i data-lucide="trash-2" class="w-5 h-5"></i></button>
                                </div>
                            </template>
                        </div>
                    </section>
                </div>

                <div x-show="activeTab === 'focus'" class="flex flex-col items-center py-12">
                    <div class="relative w-64 h-64 flex items-center justify-center mb-16">
                        <svg class="absolute inset-0 w-full h-full -rotate-90">
                            <circle cx="128" cy="128" r="120" fill="transparent" stroke="#151517" stroke-width="8" />
                            <circle cx="128" cy="128" r="120" fill="transparent" stroke="#c5a47e" stroke-width="8" stroke-dasharray="754" :stroke-dashoffset="754 - (754 * (timeLeft / 1500))" stroke-linecap="round" />
                        </svg>
                        <div class="text-center">
                            <span class="text-6xl font-black tabular-nums text-white" x-text="formatTime(timeLeft)"></span>
                        </div>
                    </div>
                    <div class="flex gap-8">
                        <button @click="toggleTimer()" class="w-20 h-20 luxury-gradient text-black rounded-[2rem] flex items-center justify-center shadow-xl">
                            <i x-show="!timerRunning" data-lucide="play" class="w-8 h-8 fill-current"></i>
                            <i x-show="timerRunning" data-lucide="pause" class="w-8 h-8"></i>
                        </button>
                    </div>
                </div>

            </main>

            <nav class="fixed bottom-8 left-0 right-0 z-30">
                <div class="max-w-xs mx-auto bg-black/80 backdrop-blur-xl border border-white/5 rounded-[3rem] px-8 py-6 flex justify-around items-center">
                    <button @click="activeTab = 'dashboard'" :class="activeTab === 'dashboard' ? 'text-[#c5a47e]' : 'text-white/20'"><i data-lucide="layout"></i></button>
                    <button @click="activeTab = 'focus'" :class="activeTab === 'focus' ? 'text-[#c5a47e]' : 'text-white/20'"><i data-lucide="zap"></i></button>
                    <button @click="activeTab = 'awards'" :class="activeTab === 'awards' ? 'text-[#c5a47e]' : 'text-white/20'"><i data-lucide="trophy"></i></button>
                </div>
            </nav>

            <div x-show="showAddTask" x-cloak class="fixed inset-0 z-[100] flex items-center justify-center bg-black/90 p-6">
                <div class="bg-[#111112] border border-[#c5a47e]/20 rounded-[3rem] p-10 w-full max-w-sm">
                    <h3 class="text-2xl font-black mb-8 text-center">משימה חדשה</h3>
                    <input x-model="newTaskTitle" placeholder="מה היעד?" class="w-full bg-white/5 p-5 rounded-2xl mb-4 outline-none border border-white/5 focus:border-[#c5a47e]/40">
                    <input x-model="newTaskSub" placeholder="תיאור קצר..." class="w-full bg-white/5 p-5 rounded-2xl mb-8 outline-none border border-white/5">
                    <button @click="addTask()" class="w-full luxury-gradient text-black p-5 rounded-2xl font-black text-lg">שמור במערכת</button>
                    <button @click="showAddTask = false" class="w-full text-slate-500 mt-4 font-bold">ביטול</button>
                </div>
            </div>

        </div>
    </template>

    <script>
        function mindFlowApp() {
            return {
                onboardingComplete: localStorage.getItem('mf_onboard') === 'true',
                activeTab: 'dashboard',
                showAddTask: false,
                showLevelUp: false,
                userProfile: JSON.parse(localStorage.getItem('mf_profile')) || {
                    name: 'דקל', level: 1, xp: 0, xpToNextLevel: 100, streak: 1
                },
                tasks: JSON.parse(localStorage.getItem('mf_tasks')) || [
                    { id: 1, title: 'קריאת בוקר מונחית', sub: '15 דקות', done: false, xp: 20 },
                    { id: 2, title: 'סשן Deep Work', sub: 'פרויקט SkorChat', done: false, xp: 50 }
                ],
                timeLeft: 1500,
                timerRunning: false,
                timerInterval: null,
                newTaskTitle: '',
                newTaskSub: '',

                init() {
                    lucide.createIcons();
                },

                completeOnboarding() {
                    this.onboardingComplete = true;
                    localStorage.setItem('mf_onboard', 'true');
                    setTimeout(() => lucide.createIcons(), 100);
                },

                addTask() {
                    if (!this.newTaskTitle) return;
                    this.tasks.push({
                        id: Date.now(),
                        title: this.newTaskTitle,
                        sub: this.newTaskSub || 'משימה אישית',
                        done: false,
                        xp: 25
                    });
                    this.save();
                    this.newTaskTitle = '';
                    this.newTaskSub = '';
                    this.showAddTask = false;
                    setTimeout(() => lucide.createIcons(), 50);
                },

                toggleTask(id) {
                    const task = this.tasks.find(t => t.id === id);
                    if (task && !task.done) {
                        task.done = true;
                        this.addXp(task.xp);
                        this.save();
                    }
                },

                deleteTask(id) {
                    this.tasks = this.tasks.filter(t => t.id !== id);
                    this.save();
                },

                addXp(amount) {
                    this.userProfile.xp += amount;
                    if (this.userProfile.xp >= this.userProfile.xpToNextLevel) {
                        this.userProfile.level++;
                        this.userProfile.xp -= this.userProfile.xpToNextLevel;
                        this.userProfile.xpToNextLevel = Math.floor(this.userProfile.xpToNextLevel * 1.3);
                        this.showLevelUp = true;
                    }
                    this.save();
                },

                toggleTimer() {
                    if (this.timerRunning) {
                        clearInterval(this.timerInterval);
                    } else {
                        this.timerInterval = setInterval(() => {
                            if (this.timeLeft > 0) {
                                this.timeLeft--;
                            } else {
                                this.toggleTimer();
                                this.addXp(100);
                                alert("סשן הושלם! +100 XP");
                                this.timeLeft = 1500;
                            }
                        }, 1000);
                    }
                    this.timerRunning = !this.timerRunning;
                },

                formatTime(seconds) {
                    const m = Math.floor(seconds / 60);
                    const s = seconds % 60;
                    return `${m}:${s.toString().padStart(2, '0')}`;
                },

                save() {
                    localStorage.setItem('mf_profile', JSON.stringify(this.userProfile));
                    localStorage.setItem('mf_tasks', JSON.stringify(this.tasks));
                }
            }
        }
    </script>
</body>
</html>
