<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindFlow Ultra | AI Personalized</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@200;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Assistant', sans-serif; background-color: #0a0a0b; color: white; overflow-x: hidden; }
        .luxury-gold { color: #c5a47e; }
        .luxury-bg { background: linear-gradient(135deg, #c5a47e 0%, #8e7356 100%); }
        .luxury-border { border-color: rgba(197, 164, 126, 0.3); }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
        [x-cloak] { display: none !important; }
        
        @keyframes pulse-gold {
            0% { box-shadow: 0 0 0 0 rgba(197, 164, 126, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(197, 164, 126, 0); }
            100% { box-shadow: 0 0 0 0 rgba(197, 164, 126, 0); }
        }
        .animate-pulse-gold { animation: pulse-gold 2s infinite; }
    </style>
</head>
<body x-data="mindFlowApp()" x-init="init()">

    <!-- UI: Notifications -->
    <div class="fixed top-6 left-1/2 -translate-x-1/2 z-[200] space-y-2 pointer-events-none">
        <template x-for="note in notifications" :key="note.id">
            <div x-transition class="glass px-6 py-3 rounded-2xl flex items-center gap-3 shadow-2xl border-l-4 border-l-[#c5a47e]">
                <i data-lucide="sparkles" class="w-4 h-4 luxury-gold"></i>
                <span class="text-sm font-bold" x-text="note.text"></span>
            </div>
        </template>
    </div>

    <!-- SCREEN 1: Onboarding Questionnaire -->
    <template x-if="step === 'onboarding'">
        <div class="min-h-screen flex flex-col items-center justify-center p-8 text-center max-w-lg mx-auto">
            <div class="mb-12">
                <i data-lucide="crown" class="w-16 h-16 luxury-gold mx-auto mb-4"></i>
                <h1 class="text-4xl font-black italic tracking-tighter">MINDFLOW <span class="luxury-gold">ULTRA</span></h1>
                <p class="text-slate-500 font-bold mt-2">הגדרת פרופיל אישי - Prestige Edition</p>
            </div>

            <div class="w-full space-y-8 text-right">
                <!-- Name -->
                <div x-show="onboardStep === 1" x-transition>
                    <label class="block text-xl font-bold mb-4">איך קוראים לך?</label>
                    <input x-model="tempProfile.name" type="text" placeholder="השם שלך..." class="w-full bg-white/5 p-6 rounded-3xl outline-none border luxury-border text-2xl font-bold focus:bg-white/10 transition-all">
                </div>

                <!-- Focus Area -->
                <div x-show="onboardStep === 2" x-transition>
                    <label class="block text-xl font-bold mb-4">מה התחום העיקרי שבו תרצה להשתפר?</label>
                    <div class="grid grid-cols-1 gap-4">
                        <template x-for="goal in ['עסקים ויזמות', 'לימודים והתפתחות', 'כושר ובריאות', 'שלווה ומיינדפולנס']">
                            <button @click="tempProfile.goal = goal" :class="tempProfile.goal === goal ? 'luxury-bg text-black' : 'glass'" class="p-5 rounded-3xl text-right font-bold transition-all flex justify-between items-center">
                                <span x-text="goal"></span>
                                <i x-show="tempProfile.goal === goal" data-lucide="check" class="w-5 h-5"></i>
                            </button>
                        </template>
                    </div>
                </div>

                <!-- Difficulty -->
                <div x-show="onboardStep === 3" x-transition>
                    <label class="block text-xl font-bold mb-4">באיזו רמת אינטנסיביות נתחיל?</label>
                    <div class="grid grid-cols-1 gap-4">
                        <template x-for="level in [{id:'light', n:'קליל (משימה ביום)'}, {id:'beast', n:'Beast Mode (אתגרים קשוחים)'}]">
                            <button @click="tempProfile.intensity = level.id" :class="tempProfile.intensity === level.id ? 'luxury-bg text-black' : 'glass'" class="p-5 rounded-3xl text-right font-bold transition-all" x-text="level.n"></button>
                        </template>
                    </div>
                </div>
            </div>

            <div class="mt-12 w-full flex gap-4">
                <button x-show="onboardStep > 1" @click="onboardStep--" class="flex-1 p-6 rounded-3xl font-bold glass">חזור</button>
                <button @click="nextOnboardStep()" class="flex-[2] p-6 rounded-3xl font-black text-xl luxury-bg text-black shadow-xl hover:scale-105 transition-all">
                    <span x-text="onboardStep === 3 ? 'סיום והתחלה' : 'המשך'"></span>
                </button>
            </div>
        </div>
    </template>

    <!-- SCREEN 2: Dashboard -->
    <template x-if="step === 'dashboard'">
        <div class="min-h-screen pb-40">
            <!-- Header -->
            <header class="px-8 py-10 flex justify-between items-center max-w-2xl mx-auto relative z-10">
                <div class="flex items-center gap-4">
                    <div class="w-14 h-14 bg-[#1a1a1c] rounded-2xl flex items-center justify-center border luxury-border shadow-2xl">
                        <span class="text-xl font-black luxury-gold" x-text="userProfile.name[0]"></span>
                    </div>
                    <div>
                        <h2 class="text-xl font-black">שלום, <span x-text="userProfile.name"></span></h2>
                        <div class="flex gap-2 text-[10px] font-bold uppercase luxury-gold tracking-widest mt-1">
                            <span>LEVEL <span x-text="userProfile.level"></span></span>
                            <span>•</span>
                            <span>STREAK <span x-text="userProfile.streak"></span></span>
                        </div>
                    </div>
                </div>
                <button @click="resetProfile()" class="p-3 glass rounded-xl text-white/20 hover:text-red-500 transition-colors">
                    <i data-lucide="refresh-cw" class="w-5 h-5"></i>
                </button>
            </header>

            <main class="max-w-2xl mx-auto px-6 space-y-10">
                
                <!-- AI Generator Block -->
                <section class="relative overflow-hidden p-8 rounded-[2.5rem] glass border luxury-border">
                    <div class="absolute top-0 right-0 p-4 opacity-10">
                        <i data-lucide="brain" class="w-20 h-20 luxury-gold"></i>
                    </div>
                    <div class="relative z-10">
                        <div class="flex items-center gap-2 mb-2">
                            <span class="luxury-bg text-black text-[10px] font-black px-2 py-0.5 rounded-full uppercase tracking-tighter">AI AGENT</span>
                            <h3 class="text-xl font-black">מחולל אתגרים אישי</h3>
                        </div>
                        <p class="text-slate-400 text-sm mb-6">מבוסס על היעדים שלך ב<span x-text="userProfile.goal"></span></p>
                        
                        <button @click="generateAiTasks()" :disabled="loadingAi" class="w-full py-4 luxury-bg text-black rounded-2xl font-black text-lg flex items-center justify-center gap-3 transition-all hover:scale-[1.02] active:scale-95 disabled:opacity-50">
                            <i x-show="!loadingAi" data-lucide="sparkles" class="w-5 h-5"></i>
                            <i x-show="loadingAi" data-lucide="loader-2" class="w-5 h-5 animate-spin"></i>
                            <span x-text="loadingAi ? 'מעבד נתונים...' : 'צור לי אתגרים חדשים'"></span>
                        </button>
                    </div>
                </section>

                <!-- Tasks List -->
                <section class="space-y-6">
                    <div class="flex justify-between items-center px-2">
                        <h3 class="text-2xl font-black tracking-tight">המסלול שלך להיום</h3>
                        <span class="text-xs font-bold text-slate-500" x-text="tasks.length + ' משימות'"></span>
                    </div>

                    <div class="space-y-4">
                        <template x-for="task in tasks" :key="task.id">
                            <div class="glass p-6 rounded-[2rem] flex items-center group transition-all" :class="task.done ? 'opacity-20 scale-95' : 'hover:border-[#c5a47e]/50'">
                                <button @click="completeTask(task)" :disabled="task.done" class="w-12 h-12 rounded-2xl border luxury-border ml-5 flex items-center justify-center transition-all" :class="task.done ? 'luxury-bg text-black' : 'text-white/20 group-hover:text-[#c5a47e]'">
                                    <i x-show="!task.done" data-lucide="zap" class="w-6 h-6"></i>
                                    <i x-show="task.done" data-lucide="check" class="w-6 h-6"></i>
                                </button>
                                <div class="flex-1">
                                    <div class="flex items-center gap-2">
                                        <h4 class="font-bold text-lg" x-text="task.title"></h4>
                                        <span class="text-[10px] font-black luxury-gold" x-text="'+' + task.xp + ' XP'"></span>
                                    </div>
                                    <p class="text-xs text-slate-500 font-medium" x-text="task.sub"></p>
                                </div>
                                <button @click="deleteTask(task.id)" class="opacity-0 group-hover:opacity-100 p-2 text-white/10 hover:text-red-500 transition-all">
                                    <i data-lucide="x" class="w-4 h-4"></i>
                                </button>
                            </div>
                        </template>

                        <template x-if="tasks.length === 0">
                            <div class="text-center py-12 border-2 border-dashed border-white/5 rounded-[2rem]">
                                <i data-lucide="clipboard-list" class="w-12 h-12 text-white/5 mx-auto mb-4"></i>
                                <p class="text-slate-500 font-bold">אין משימות כרגע. תן ל-AI לייצר לך משהו קשוח!</p>
                            </div>
                        </template>
                    </div>
                </section>

                <!-- XP Progress -->
                <section class="bg-[#151517] p-8 rounded-[2.5rem] border luxury-border">
                    <div class="flex justify-between items-end mb-4">
                        <div>
                            <p class="text-[10px] font-black text-slate-500 uppercase tracking-widest">Progress</p>
                            <h4 class="text-2xl font-black tracking-tighter"><span x-text="userProfile.xp"></span> / <span x-text="userProfile.xpToNextLevel"></span> XP</h4>
                        </div>
                        <i data-lucide="trending-up" class="luxury-gold"></i>
                    </div>
                    <div class="h-2 bg-black rounded-full overflow-hidden">
                        <div class="h-full luxury-bg transition-all duration-700" :style="`width: ${(userProfile.xp/userProfile.xpToNextLevel)*100}%`"></div>
                    </div>
                </section>
            </main>

            <!-- Nav -->
            <nav class="fixed bottom-10 left-0 right-0 z-50">
                <div class="max-w-xs mx-auto glass p-6 rounded-[3rem] flex justify-around items-center shadow-2xl">
                    <button @click="activeTab = 'home'" :class="activeTab === 'home' ? 'luxury-gold scale-125' : 'text-white/20'"><i data-lucide="layout-grid"></i></button>
                    <button @click="activeTab = 'timer'" :class="activeTab === 'timer' ? 'luxury-gold scale-125' : 'text-white/20'"><i data-lucide="timer"></i></button>
                    <button @click="activeTab = 'awards'" :class="activeTab === 'awards' ? 'text-white/20'"><i data-lucide="award"></i></button>
                </div>
            </nav>
        </div>
    </template>

    <!-- Level Up Modal -->
    <div x-show="showLevelModal" x-cloak class="fixed inset-0 z-[300] bg-black/95 backdrop-blur-2xl flex items-center justify-center p-8 text-center" x-transition>
        <div>
            <div class="relative inline-block mb-10">
                <i data-lucide="trophy" class="w-40 h-40 luxury-gold animate-bounce drop-shadow-[0_0_50px_rgba(197,164,126,0.5)]"></i>
            </div>
            <h2 class="text-6xl font-black mb-4">עלית רמה!</h2>
            <p class="text-2xl font-bold luxury-gold mb-12">הגעת לרמה <span x-text="userProfile.level"></span></p>
            <button @click="showLevelModal = false" class="luxury-bg text-black px-12 py-5 rounded-[2rem] font-black text-xl shadow-2xl transition-all hover:scale-110">המשך בכיבוש</button>
        </div>
    </div>

    <script>
        function mindFlowApp() {
            return {
                apiKey: "", // הקישור מתבצע אוטומטית בסביבה
                step: 'onboarding',
                onboardStep: 1,
                activeTab: 'home',
                loadingAi: false,
                showLevelModal: false,
                notifications: [],
                
                userProfile: {
                    name: '',
                    goal: '',
                    intensity: 'light',
                    level: 1,
                    xp: 0,
                    xpToNextLevel: 100,
                    streak: 1
                },

                tempProfile: {
                    name: '',
                    goal: '',
                    intensity: 'light'
                },

                tasks: [],

                init() {
                    const saved = localStorage.getItem('mf_ultra_user');
                    if (saved) {
                        this.userProfile = JSON.parse(saved);
                        this.step = 'dashboard';
                    }
                    this.tasks = JSON.parse(localStorage.getItem('mf_ultra_tasks')) || [];
                    
                    this.$nextTick(() => lucide.createIcons());
                    
                    // Cleanup old notifications
                    setInterval(() => {
                        if (this.notifications.length > 0) this.notifications.shift();
                    }, 4000);
                },

                nextOnboardStep() {
                    if (this.onboardStep === 1 && !this.tempProfile.name) return;
                    if (this.onboardStep === 2 && !this.tempProfile.goal) return;
                    
                    if (this.onboardStep < 3) {
                        this.onboardStep++;
                    } else {
                        this.userProfile = { ...this.userProfile, ...this.tempProfile };
                        this.save();
                        this.step = 'dashboard';
                        this.notify("ברוך הבא ל-MindFlow Ultra ✨");
                        this.$nextTick(() => lucide.createIcons());
                    }
                },

                notify(text) {
                    const id = Date.now();
                    this.notifications.push({ id, text });
                },

                async generateAiTasks() {
                    this.loadingAi = true;
                    
                    const systemPrompt = `You are MindFlow AI Agent. Generate 3 personalized tasks for a user named ${this.userProfile.name}. 
                    Focus Area: ${this.userProfile.goal}. 
                    Intensity: ${this.userProfile.intensity}.
                    Language: Hebrew.
                    Response format: JSON only. 
                    Structure: { "tasks": [{ "title": "string", "sub": "string", "xp": number }] }`;

                    const userQuery = `Create 3 challenging tasks for today based on my profile.`;

                    try {
                        const response = await this.callGemini(userQuery, systemPrompt);
                        const data = JSON.parse(response);
                        
                        if (data.tasks) {
                            const newTasks = data.tasks.map(t => ({ ...t, id: Math.random(), done: false }));
                            this.tasks = [...newTasks, ...this.tasks];
                            this.save();
                            this.notify("ה-AI יצר עבורך משימות חדשות!");
                            this.$nextTick(() => lucide.createIcons());
                        }
                    } catch (e) {
                        console.error(e);
                        this.notify("שגיאה בחיבור ל-AI. נסה שוב.");
                    } finally {
                        this.loadingAi = false;
                    }
                },

                async callGemini(userQuery, systemPrompt, retries = 5) {
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${this.apiKey}`;
                    const payload = {
                        contents: [{ parts: [{ text: userQuery }] }],
                        systemInstruction: { parts: [{ text: systemPrompt }] },
                        generationConfig: { responseMimeType: "application/json" }
                    };

                    for (let i = 0; i < retries; i++) {
                        try {
                            const res = await fetch(url, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(payload)
                            });
                            const result = await res.json();
                            return result.candidates[0].content.parts[0].text;
                        } catch (e) {
                            if (i === retries - 1) throw e;
                            await new Promise(r => setTimeout(r, Math.pow(2, i) * 1000));
                        }
                    }
                },

                completeTask(task) {
                    task.done = true;
                    this.userProfile.xp += task.xp;
                    this.notify(`+${task.xp} XP הופקדו בחשבון!`);
                    
                    if (this.userProfile.xp >= this.userProfile.xpToNextLevel) {
                        this.levelUp();
                    }
                    this.save();
                },

                levelUp() {
                    this.userProfile.level++;
                    this.userProfile.xp -= this.userProfile.xpToNextLevel;
                    this.userProfile.xpToNextLevel = Math.floor(this.userProfile.xpToNextLevel * 1.4);
                    this.showLevelModal = true;
                    this.$nextTick(() => lucide.createIcons());
                },

                deleteTask(id) {
                    this.tasks = this.tasks.filter(t => t.id !== id);
                    this.save();
                },

                resetProfile() {
                    if (confirm("האם לאפס את כל ההתקדמות שלך?")) {
                        localStorage.clear();
                        window.location.reload();
                    }
                },

                save() {
                    localStorage.setItem('mf_ultra_user', JSON.stringify(this.userProfile));
                    localStorage.setItem('mf_ultra_tasks', JSON.stringify(this.tasks));
                }
            }
        }
    </script>
</body>
</html>
